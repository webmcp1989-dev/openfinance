openapi: 3.1.0
info:
  title: Acme AP and independent AR reference HTTP contracts
  version: 2.0.0
  license:
    name: MIT
    identifier: MIT
  description: >-
    Same-origin backend contracts for the submitted Acme AP product and, separately,
    the OpenFinance AR demo reference system. Acme AP owns 12 browser WebMCP tools;
    AR owns an independent seven-tool browser inventory plus its own OAuth discovery
    and remote MCP transport. The contracts share this document for repository
    convenience only: the applications do not share authentication, data, services,
    or tool counts. Application APIs require their own Supabase cookie session;
    remote MCP uses a resource-bound Supabase OAuth Bearer token and MCP JSON-RPC
    semantics.
servers:
  - url: https://openfinance-ar.vercel.app
    description: OpenFinance AR
  - url: https://openfinance-ap.vercel.app
    description: Acme AP supplier portal
security:
  - cookieSession: []
paths:
  /.well-known/oauth-protected-resource/mcp:
    servers:
      - url: https://openfinance-ar.vercel.app
    get:
      operationId: discoverOpenFinanceMcpResource
      summary: Discover the OAuth-protected OpenFinance AR MCP resource
      security: []
      responses:
        "200":
          description: RFC 9728 protected-resource metadata
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [resource, authorization_servers, bearer_methods_supported]
                properties:
                  resource: { type: string, format: uri }
                  authorization_servers:
                    type: array
                    minItems: 1
                    items: { type: string, format: uri }
                  bearer_methods_supported:
                    type: array
                    items: { type: string, enum: [header] }
                  scopes_supported:
                    type: array
                    items: { type: string }
  /mcp:
    servers:
      - url: https://openfinance-ar.vercel.app
    post:
      operationId: invokeOpenFinanceMcp
      summary: Invoke the OpenFinance AR Streamable HTTP MCP transport
      description: >-
        MCP JSON-RPC endpoint. Exact method, tool, input, output, notification, and
        protocol-version contracts are defined by MCP discovery metadata, not OpenAPI.
      security:
        - oauthMcpBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: MCP JSON or SSE protocol response }
        "401": { description: Missing, invalid, expired, or wrong-resource OAuth token }
        "403": { description: Host or Origin is not allowed }
        "413": { description: Request exceeds 128 KiB }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /api/agent/invoices:
    servers:
      - url: https://openfinance-ar.vercel.app
    get:
      operationId: listInvoiceQueue
      summary: List tenant-authorized AR invoices
      parameters:
        - in: query
          name: customerName
          required: true
          schema: { type: string, minLength: 1, maxLength: 160 }
        - in: query
          name: readyOnly
          schema: { type: string, enum: ["true", "false"] }
      responses:
        "200":
          description: Invoice queue
          content:
            application/json:
              schema:
                type: object
                required: [items, count]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/InvoiceQueueItem" } }
                  count: { type: integer, minimum: 0 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/agent/erp-sync:
    servers:
      - url: https://openfinance-ar.vercel.app
    post:
      operationId: syncInvoicesFromErp
      summary: Idempotently simulate an inbound ERP invoice sync
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ErpSyncRequest" }
      responses:
        "200":
          description: Two imported invoices or a successful no-new-invoices result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErpSyncResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/agent/packages:
    servers:
      - url: https://openfinance-ar.vercel.app
    post:
      operationId: getSubmissionPackage
      summary: Read complete packages for locally ready or rejected invoices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [invoiceNumbers]
              properties:
                invoiceNumbers:
                  type: array
                  minItems: 1
                  maxItems: 3
                  uniqueItems: true
                  items: { $ref: "#/components/schemas/InvoiceNumber" }
      responses:
        "200":
          description: Checksum-protected invoice packages
          content:
            application/json:
              schema:
                type: object
                required: [items, count]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/InvoicePackage" } }
                  count: { type: integer, minimum: 1, maximum: 3 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /api/agent/delivery-events:
    servers:
      - url: https://openfinance-ar.vercel.app
    post:
      operationId: recordDeliveryEvent
      summary: Idempotently record verified portal results or exceptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/PortalResultRequest"
                - $ref: "#/components/schemas/PortalExceptionRequest"
              discriminator: { propertyName: eventType }
      responses:
        "200":
          description: Recorded delivery result or exception
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryEventResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/agent/followups:
    servers:
      - url: https://openfinance-ar.vercel.app
    get:
      operationId: listPortalFollowups
      summary: List tenant-authorized AR invoices requiring portal follow-up
      parameters:
        - in: query
          name: customerName
          schema: { type: string, minLength: 1, maxLength: 160 }
      responses:
        "200":
          description: Actionable portal follow-ups
          content:
            application/json:
              schema:
                type: object
                required: [items, count]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/PortalFollowup" } }
                  count: { type: integer, minimum: 0 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/agent/supporting-documents:
    servers:
      - url: https://openfinance-ar.vercel.app
    post:
      operationId: getInvoiceSupportingDocuments
      summary: Read tenant-authorized supporting PDFs for one AR invoice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceNumberRequest" }
      responses:
        "200":
          description: Checksum-protected supporting documents
          content:
            application/json:
              schema:
                type: object
                required: [invoiceNumber, documents, count]
                properties:
                  invoiceNumber: { $ref: "#/components/schemas/InvoiceNumber" }
                  documents: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/SupportingDocument" } }
                  count: { type: integer, minimum: 0 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /api/agent/remittances:
    servers:
      - url: https://openfinance-ar.vercel.app
    post:
      operationId: recordPaymentRemittance
      summary: Idempotently record a verified customer payment allocation in AR
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordRemittanceRequest" }
      responses:
        "200": { description: Durable remittance reconciliation result }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/agent/workspace:
    servers:
      - url: https://openfinance-ar.vercel.app
      - url: https://openfinance-ap.vercel.app
    get:
      operationId: getVisibleWorkspaceState
      summary: Read the signed-in application's visible state and recent audit trail
      description: >-
        The response shape is origin-specific. OpenFinance returns invoices and delivery
        audit events; Acme returns purchase orders, submissions, current exception workflows,
        and submission audit events.
      responses:
        "200":
          description: Tenant-scoped workspace state
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/OpenFinanceWorkspaceState" }
                  - { $ref: "#/components/schemas/AcmeWorkspaceState" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/agent/requirements:
    servers:
      - url: https://openfinance-ap.vercel.app
    get:
      operationId: getInvoiceRequirements
      summary: Read Acme's current supplier invoice policy
      responses:
        "200":
          description: Submission requirements
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmissionRequirements" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/agent/purchase-orders:
    servers:
      - url: https://openfinance-ap.vercel.app
    get:
      operationId: listOpenPurchaseOrders
      summary: List supplier-authorized open purchase orders with line and receipt context
      responses:
        "200":
          description: Open purchase orders
          content:
            application/json:
              schema:
                type: object
                required: [purchaseOrders, count]
                properties:
                  purchaseOrders: { type: array, items: { $ref: "#/components/schemas/PurchaseOrder" } }
                  count: { type: integer, minimum: 0 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      operationId: getPurchaseOrderDetails
      summary: Get one supplier-authorized purchase order with line and receipt context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [purchaseOrderNumber]
              properties:
                purchaseOrderNumber: { $ref: "#/components/schemas/PurchaseOrderNumber" }
      responses:
        "200":
          description: Purchase order lookup result
          content:
            application/json:
              schema:
                type: object
                required: [found, purchaseOrder]
                properties:
                  found: { type: boolean }
                  purchaseOrder:
                    oneOf:
                      - { $ref: "#/components/schemas/PurchaseOrder" }
                      - { type: "null" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /api/agent/supplier-invoices:
    servers:
      - url: https://openfinance-ap.vercel.app
    get:
      operationId: listSupplierInvoices
      summary: List supplier invoices with optional status or PO filter
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [received, under_review, accepted, rejected, disputed, voided, paid] }
        - in: query
          name: purchaseOrderNumber
          schema: { $ref: "#/components/schemas/PurchaseOrderNumber" }
      responses:
        "200":
          description: Supplier invoice receipts
          content:
            application/json:
              schema:
                type: object
                required: [invoices, count]
                properties:
                  invoices: { type: array, items: { $ref: "#/components/schemas/SubmissionReceipt" } }
                  count: { type: integer, minimum: 0 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/agent/validate:
    servers:
      - url: https://openfinance-ap.vercel.app
    post:
      operationId: validateInvoice
      summary: Preflight one invoice without reserving balance or writing data
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceCandidate" }
      responses:
        "200":
          description: Validation decision and precise issues
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /api/agent/submissions:
    servers:
      - url: https://openfinance-ap.vercel.app
    post:
      operationId: submitInvoiceBatch
      summary: Atomically submit a human-confirmed valid invoice batch
      description: >-
        Consequential document operation. The portal prepares a short-lived, single-use
        approval, shows its exact batch manifest to the signed-in human, and supplies the
        returned approval identifier only after explicit confirmation. PostgreSQL binds and
        consumes that approval in the same transaction as the batch mutation.
      parameters:
        - { $ref: "#/components/parameters/DocumentApproval" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [idempotencyKey, invoices]
              properties:
                idempotencyKey: { $ref: "#/components/schemas/IdempotencyKey" }
                invoices:
                  type: array
                  minItems: 1
                  maxItems: 3
                  uniqueItems: true
                  items: { $ref: "#/components/schemas/InvoiceCandidate" }
      responses:
        "200":
          description: Stable portal references for the committed batch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmissionBatchResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
  /api/agent/document-approvals:
    servers:
      - url: https://openfinance-ap.vercel.app
    post:
      operationId: requestDocumentSubmissionApproval
      summary: Prepare a short-lived approval for exact document metadata
      description: >-
        Creates only a pending consent record. The request contains filenames and SHA-256
        values but never PDF base64. It does not submit, attach, or replace a document.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentSubmissionApprovalRequest" }
      responses:
        "200":
          description: Pending approval challenge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentSubmissionApproval" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    patch:
      operationId: decideDocumentSubmissionApproval
      summary: Approve or deny one exact pending document action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [approvalId, decision]
              properties:
                approvalId: { type: string, format: uuid }
                decision: { type: string, enum: [approved, denied] }
      responses:
        "200":
          description: Recorded human decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentSubmissionApproval" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /api/agent/invoices/{invoiceNumber}/document:
    servers:
      - url: https://openfinance-ar.vercel.app
    get:
      operationId: downloadInvoiceDocument
      summary: Download one authenticated, tenant-scoped AR invoice PDF
      parameters:
        - in: path
          name: invoiceNumber
          required: true
          schema: { $ref: "#/components/schemas/InvoiceNumber" }
      responses:
        "200":
          description: Verified detailed invoice PDF with supplier, customer, dates, PO, amount due, and its stored SHA-256 digest
          headers:
            Content-Disposition:
              schema: { type: string }
            X-Invoice-Document-SHA256:
              schema: { type: string, pattern: "^[a-f0-9]{64}$" }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/agent/status:
    servers:
      - url: https://openfinance-ap.vercel.app
    post:
      operationId: getInvoiceStatus
      summary: Read the current portal status for one supplier invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [invoiceNumber]
              properties:
                invoiceNumber: { $ref: "#/components/schemas/InvoiceNumber" }
      responses:
        "200":
          description: Status lookup result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceStatusResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /api/agent/exceptions:
    servers:
      - url: https://openfinance-ap.vercel.app
    post:
      operationId: getInvoiceException
      summary: Read structured exceptions and permitted resolutions for one invoice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceNumberRequest" }
      responses:
        "200":
          description: Invoice exception details with stored ownership and supplier authority boundary
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [invoiceNumber, portalReference, exceptions]
                properties:
                  invoiceNumber: { $ref: "#/components/schemas/InvoiceNumber" }
                  portalReference: { type: string }
                  exceptions: { type: array, items: { $ref: "#/components/schemas/InvoiceException" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /api/agent/exception-responses:
    servers:
      - url: https://openfinance-ap.vercel.app
    post:
      operationId: respondToInvoiceException
      summary: Idempotently send a human-approved exception response and evidence
      parameters:
        - { $ref: "#/components/parameters/DocumentApproval" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExceptionResponseRequest" }
      responses:
        "200":
          description: Durable response receipt including the authoritative exception and invoice outcome
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExceptionResponseResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Idempotency conflict, inactive exception, buyer-owned authority boundary, or missing required evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
  /api/agent/replacements:
    servers:
      - url: https://openfinance-ap.vercel.app
    post:
      operationId: replaceRejectedInvoice
      summary: Transactionally supersede a rejected invoice with a corrected revision
      parameters:
        - { $ref: "#/components/parameters/DocumentApproval" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [idempotencyKey, invoice]
              properties:
                idempotencyKey: { $ref: "#/components/schemas/IdempotencyKey" }
                invoice: { $ref: "#/components/schemas/InvoiceCandidate" }
      responses:
        "200": { description: Corrected revision receipt and superseded reference }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
  /api/agent/inquiries:
    servers:
      - url: https://openfinance-ap.vercel.app
    post:
      operationId: createInvoiceInquiry
      summary: Idempotently open a tracked buyer AP inquiry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceInquiryRequest" }
      responses:
        "200":
          description: Durable AP case reference and open status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceInquiryResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/agent/remittance:
    servers:
      - url: https://openfinance-ap.vercel.app
    post:
      operationId: getPaymentRemittance
      summary: Read the payment schedule and completed remittance for one invoice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceNumberRequest" }
      responses:
        "200": { description: Payment status, reference, method, amount, and allocations }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /api/demo/reset:
    servers:
      - url: https://openfinance-ar.vercel.app
      - url: https://openfinance-ap.vercel.app
    post:
      operationId: restoreSyntheticDemoState
      summary: Restore one application's independent synthetic demo state
      description: >-
        Human-only capability. It is intentionally absent from WebMCP and must be
        confirmed separately in each application. The authenticated database function
        allows only the seeded demo operator or submitter and records the reset in that
        application's audit trail.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmation]
              properties:
                confirmation: { type: string, const: restore-canonical-demo }
      responses:
        "200":
          description: This application's synthetic baseline was restored
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/OpenFinanceDemoResetResult" }
                  - { $ref: "#/components/schemas/AcmeDemoResetResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }
components:
  parameters:
    DocumentApproval:
      in: header
      name: X-OpenFinance-Document-Approval
      required: true
      description: >-
        Opaque, short-lived approval identifier created for the same signed-in user,
        tenant, action, idempotency key, and exact document metadata. It is never a
        WebMCP input and is consumed transactionally by the AP mutation.
      schema: { type: string, format: uuid }
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: sb-session
      description: Logical Supabase SSR cookie session; actual cookie names are project-specific.
    oauthMcpBearer:
      type: oauth2
      description: Supabase OAuth 2.1 authorization code with PKCE and an exact OpenFinance MCP resource indicator.
      flows:
        authorizationCode:
          authorizationUrl: https://bhjtwmpwlmdqjxlvgrhj.supabase.co/auth/v1/oauth/authorize
          tokenUrl: https://bhjtwmpwlmdqjxlvgrhj.supabase.co/auth/v1/oauth/token
          scopes:
            email: Confirm the signed-in user's email identity
  responses:
    BadRequest:
      description: Request fields or query parameters are invalid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthenticated:
      description: Valid application session required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: A same-origin request and sufficient tenant-scoped role are required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: The authenticated tenant cannot access the requested resource
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: Resource state or idempotency conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unprocessable:
      description: Business validation rejected the request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    UnsupportedMediaType:
      description: Content-Type must be application/json
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    PreconditionRequired:
      description: Fresh human approval is required for this exact document action
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    InvoiceNumber:
      type: string
      pattern: "^[A-Z0-9][A-Z0-9-]{1,39}$"
    PurchaseOrderNumber:
      type: string
      pattern: "^[A-Z0-9][A-Z0-9-]{1,39}$"
    IdempotencyKey:
      type: string
      minLength: 16
      maxLength: 128
    DocumentMetadata:
      type: object
      additionalProperties: false
      required: [fileName, mediaType, sha256]
      properties:
        fileName: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,119}$" }
        mediaType: { type: string, const: application/pdf }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
    DocumentSubmissionApprovalRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, initiatedBy, manifest]
      properties:
        idempotencyKey: { $ref: "#/components/schemas/IdempotencyKey" }
        initiatedBy: { type: string, enum: [agent, human] }
        manifest:
          description: PDF base64 is forbidden; documents are represented only by filename, media type, and SHA-256.
          oneOf:
            - { $ref: "#/components/schemas/BatchSubmissionApprovalManifest" }
            - { $ref: "#/components/schemas/ExceptionResponseApprovalManifest" }
            - { $ref: "#/components/schemas/ReplacementApprovalManifest" }
    ApprovalInvoiceMetadata:
      type: object
      additionalProperties: false
      required: [invoiceNumber, invoiceDate, amountMinor, currency, purchaseOrderNumber, document]
      properties:
        invoiceNumber: { $ref: "#/components/schemas/InvoiceNumber" }
        invoiceDate: { type: string, format: date }
        amountMinor: { type: integer, minimum: 1, maximum: 9007199254740991 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        purchaseOrderNumber: { $ref: "#/components/schemas/PurchaseOrderNumber" }
        document: { $ref: "#/components/schemas/DocumentMetadata" }
    ApprovalSupportingDocumentMetadata:
      type: object
      additionalProperties: false
      required: [fileName, mediaType, sha256, documentKind]
      properties:
        fileName: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,119}$" }
        mediaType: { type: string, const: application/pdf }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        documentKind: { type: string, enum: [proof_of_delivery, service_acceptance, timesheet, tax_document, contract, other] }
    BatchSubmissionApprovalManifest:
      type: object
      additionalProperties: false
      required: [action, invoices]
      properties:
        action: { type: string, const: submit_invoice_batch }
        invoices:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: "#/components/schemas/ApprovalInvoiceMetadata" }
    ExceptionResponseApprovalManifest:
      type: object
      additionalProperties: false
      required: [action, invoiceNumber, exceptionCode, message, attachments]
      properties:
        action: { type: string, const: respond_to_invoice_exception }
        invoiceNumber: { $ref: "#/components/schemas/InvoiceNumber" }
        exceptionCode: { type: string, pattern: "^[a-z][a-z0-9_]{1,63}$" }
        message: { type: string, minLength: 1, maxLength: 1000 }
        attachments:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/ApprovalSupportingDocumentMetadata" }
    ReplacementApprovalManifest:
      type: object
      additionalProperties: false
      required: [action, invoice]
      properties:
        action: { type: string, const: replace_rejected_invoice }
        invoice: { $ref: "#/components/schemas/ApprovalInvoiceMetadata" }
    DocumentSubmissionApproval:
      type: object
      additionalProperties: false
      required: [approvalId, status, expiresAt]
      properties:
        approvalId: { type: string, format: uuid }
        status: { type: string, enum: [pending, approved, denied, consumed] }
        expiresAt: { type: string, format: date-time }
    ErpSyncRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey]
      properties:
        idempotencyKey: { $ref: "#/components/schemas/IdempotencyKey" }
    ErpSyncItem:
      type: object
      additionalProperties: false
      required: [invoiceNumber, customerName, amountMinor, currency, purchaseOrderNumber]
      properties:
        invoiceNumber: { $ref: "#/components/schemas/InvoiceNumber" }
        customerName: { type: string, minLength: 1, maxLength: 160 }
        amountMinor: { type: integer, minimum: 1, maximum: 9007199254740991 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        purchaseOrderNumber:
          oneOf:
            - { $ref: "#/components/schemas/PurchaseOrderNumber" }
            - { type: "null" }
    ErpSyncResult:
      type: object
      additionalProperties: false
      required: [importedCount, items, syncedAt]
      properties:
        importedCount: { type: integer, enum: [0, 2] }
        items:
          type: array
          maxItems: 2
          items: { $ref: "#/components/schemas/ErpSyncItem" }
        syncedAt: { type: string, format: date-time }
    InvoiceQueueItem:
      type: object
      required: [invoiceNumber, customerName, amountMinor, currency, invoiceDate, purchaseOrderNumber, status, portalReference, portalStatus, exceptionCode, exceptionMessage, dueDate, lastPortalCheckedAt, paidAmountMinor, lastPaymentAt, lastPaymentReference, version]
      properties:
        invoiceNumber: { $ref: "#/components/schemas/InvoiceNumber" }
        customerName: { type: string }
        amountMinor: { type: integer, minimum: 1, maximum: 9007199254740991 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        invoiceDate: { type: string, format: date }
        purchaseOrderNumber:
          oneOf:
            - { $ref: "#/components/schemas/PurchaseOrderNumber" }
            - { type: "null" }
        status: { type: string, enum: [ready, needs_attention, submitted, accepted, rejected] }
        portalReference: { type: [string, "null"] }
        portalStatus: { type: [string, "null"] }
        exceptionCode: { type: [string, "null"] }
        exceptionMessage: { type: [string, "null"] }
        dueDate: { type: string, format: date }
        lastPortalCheckedAt: { type: [string, "null"], format: date-time }
        paidAmountMinor: { type: integer, minimum: 0, maximum: 9007199254740991 }
        lastPaymentAt: { type: [string, "null"], format: date-time }
        lastPaymentReference: { type: [string, "null"], maxLength: 120 }
        version: { type: integer, minimum: 1 }
    InvoiceDocument:
      type: object
      additionalProperties: false
      required: [fileName, mediaType, contentBase64, sha256]
      properties:
        fileName: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,119}$" }
        mediaType: { type: string, const: application/pdf }
        contentBase64:
          type: string
          minLength: 8
          maxLength: 1400000
          pattern: "^[A-Za-z0-9+/]+={0,2}$"
          description: >-
            Canonical RFC 4648 base64 without line wrapping or whitespace. Decoded content must be at most 1 MiB and use the accepted classic PDF profile: `%PDF-` header, catalog and page markers, plus a terminal numeric `startxref` whose byte offset points to an `xref` table before `%%EOF`.
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
    InvoicePackage:
      allOf:
        - { $ref: "#/components/schemas/InvoiceQueueItem" }
        - type: object
          required: [document]
          properties:
            document: { $ref: "#/components/schemas/InvoiceDocument" }
    InvoiceCandidate:
      type: object
      additionalProperties: false
      required: [invoiceNumber, invoiceDate, amountMinor, currency, purchaseOrderNumber, document]
      properties:
        invoiceNumber: { $ref: "#/components/schemas/InvoiceNumber" }
        invoiceDate: { type: string, format: date }
        amountMinor: { type: integer, minimum: 1, maximum: 9007199254740991 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        purchaseOrderNumber: { $ref: "#/components/schemas/PurchaseOrderNumber" }
        document: { $ref: "#/components/schemas/InvoiceDocument" }
    InvoiceNumberRequest:
      type: object
      additionalProperties: false
      required: [invoiceNumber]
      properties:
        invoiceNumber: { $ref: "#/components/schemas/InvoiceNumber" }
    SupportingDocument:
      allOf:
        - { $ref: "#/components/schemas/InvoiceDocument" }
        - type: object
          required: [documentKind, sizeBytes]
          properties:
            documentKind: { type: string, enum: [proof_of_delivery, service_acceptance, timesheet, tax_document, contract, other] }
            sizeBytes: { type: integer, minimum: 1, maximum: 1048576 }
    PortalFollowup:
      allOf:
        - { $ref: "#/components/schemas/InvoiceQueueItem" }
        - type: object
          required: [followupReason, suggestedAction, remainingDueMinor]
          properties:
            followupReason: { type: string, enum: [needs_attention, rejected, status_stale, overdue, partially_paid] }
            suggestedAction: { type: string, minLength: 1, maxLength: 1000 }
            remainingDueMinor: { type: integer, minimum: 0, maximum: 9007199254740991 }
    RecordRemittanceRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, invoiceNumber, paymentReference, amountMinor, currency, paymentMethod, paidAt]
      properties:
        idempotencyKey: { $ref: "#/components/schemas/IdempotencyKey" }
        invoiceNumber: { $ref: "#/components/schemas/InvoiceNumber" }
        paymentReference: { type: string, minLength: 1, maxLength: 120 }
        amountMinor: { type: integer, minimum: 1, maximum: 9007199254740991 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        paymentMethod: { type: string, enum: [ach, wire, check, card, other] }
        paidAt: { type: string, format: date-time }
    ExceptionResponseRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, invoiceNumber, exceptionCode, message, attachments]
      properties:
        idempotencyKey: { $ref: "#/components/schemas/IdempotencyKey" }
        invoiceNumber: { $ref: "#/components/schemas/InvoiceNumber" }
        exceptionCode: { type: string, pattern: "^[a-z][a-z0-9_]{1,63}$" }
        message: { type: string, minLength: 1, maxLength: 1000 }
        attachments:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/SupportingDocument" }
    ExceptionResponseResult:
      type: object
      additionalProperties: false
      required: [invoiceNumber, exceptionCode, exceptionStatus, invoiceStatus, respondedAt, attachmentCount, resolution]
      properties:
        invoiceNumber: { $ref: "#/components/schemas/InvoiceNumber" }
        exceptionCode: { type: string, pattern: "^[a-z][a-z0-9_]{1,63}$" }
        exceptionStatus: { type: string, enum: [responded, resolved] }
        invoiceStatus: { type: string, enum: [received, under_review, accepted, rejected, disputed, voided, paid] }
        respondedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
        attachmentCount: { type: integer, minimum: 0, maximum: 3 }
        resolution: { type: string, enum: [required_evidence_verified, buyer_review_required] }
    InvoiceInquiryRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, invoiceNumber, inquiryType, subject, message]
      properties:
        idempotencyKey: { $ref: "#/components/schemas/IdempotencyKey" }
        invoiceNumber: { $ref: "#/components/schemas/InvoiceNumber" }
        inquiryType: { type: string, enum: [payment_inquiry, invoice_inquiry, expedite_payment, payment_terms, invoice_entry_assistance] }
        subject: { type: string, minLength: 1, maxLength: 160 }
        message: { type: string, minLength: 1, maxLength: 1000 }
    InvoiceInquiryResult:
      type: object
      additionalProperties: false
      required: [invoiceNumber, caseReference, inquiryType, status, createdAt]
      properties:
        invoiceNumber: { $ref: "#/components/schemas/InvoiceNumber" }
        caseReference: { type: string, pattern: "^CASE-[0-9]{8}-[A-F0-9]{8}$" }
        inquiryType: { type: string, enum: [payment_inquiry, invoice_inquiry, expedite_payment, payment_terms, invoice_entry_assistance] }
        status: { type: string, const: open }
        createdAt: { type: string, format: date-time }
    PortalResultRequest:
      type: object
      additionalProperties: false
      required: [eventType, idempotencyKey, items]
      properties:
        eventType: { type: string, const: portal_result }
        idempotencyKey: { $ref: "#/components/schemas/IdempotencyKey" }
        items:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            type: object
            additionalProperties: false
            required: [invoiceNumber, portalReference, portalStatus]
            properties:
              invoiceNumber: { $ref: "#/components/schemas/InvoiceNumber" }
              portalReference: { type: string, minLength: 1, maxLength: 120 }
              portalStatus: { type: string, enum: [received, under_review, accepted] }
              supersedesPortalReference:
                type: string
                minLength: 1
                maxLength: 120
                description: Exact current AR portal reference required only when recording a corrected AP revision with a new reference.
    PortalExceptionRequest:
      type: object
      additionalProperties: false
      required: [eventType, idempotencyKey, items]
      properties:
        eventType: { type: string, const: portal_exception }
        idempotencyKey: { $ref: "#/components/schemas/IdempotencyKey" }
        items:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            type: object
            additionalProperties: false
            required: [invoiceNumber, exceptionCode, message]
            properties:
              invoiceNumber: { $ref: "#/components/schemas/InvoiceNumber" }
              exceptionCode: { type: string, pattern: "^[a-z][a-z0-9_]{1,63}$" }
              message: { type: string, minLength: 1, maxLength: 500 }
    DeliveryEventResult:
      type: object
      additionalProperties: false
      required: [eventType, items, recordedAt]
      properties:
        eventType: { type: string, enum: [portal_result, portal_exception] }
        items:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [invoiceNumber, recorded]
            properties:
              invoiceNumber: { $ref: "#/components/schemas/InvoiceNumber" }
              recorded: { type: boolean, const: true }
        recordedAt: { type: string, format: date-time }
    PurchaseOrder:
      type: object
      required: [purchaseOrderNumber, description, currency, authorizedAmountMinor, remainingAmountMinor, status, orderDate, paymentTerms, receiptRequired, receivedAmountMinor, serviceEntryRequired, serviceEntryStatus, priceToleranceBasisPoints, amountToleranceMinor, requiredAttachmentKinds, lines, version]
      properties:
        purchaseOrderNumber: { $ref: "#/components/schemas/PurchaseOrderNumber" }
        description: { type: string }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        authorizedAmountMinor: { type: integer, minimum: 1, maximum: 9007199254740991 }
        remainingAmountMinor: { type: integer, minimum: 0, maximum: 9007199254740991 }
        status: { type: string, enum: [open, closed] }
        orderDate: { type: string, format: date }
        paymentTerms: { type: string, minLength: 1, maxLength: 80 }
        receiptRequired: { type: boolean }
        receivedAmountMinor: { type: integer, minimum: 0, maximum: 9007199254740991 }
        serviceEntryRequired: { type: boolean }
        serviceEntryStatus: { type: string, enum: [not_required, missing, pending, accepted, rejected] }
        priceToleranceBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
        amountToleranceMinor: { type: integer, minimum: 0, maximum: 9007199254740991 }
        requiredAttachmentKinds: { type: array, uniqueItems: true, items: { type: string } }
        lines:
          type: array
          items:
            type: object
            required: [lineNumber, description, unitOfMeasure, orderedQuantity, receivedQuantity, unitPriceMinor, lineAmountMinor, invoicedAmountMinor]
            properties:
              lineNumber: { type: integer, minimum: 1 }
              description: { type: string }
              unitOfMeasure: { type: string }
              orderedQuantity: { type: number, exclusiveMinimum: 0 }
              receivedQuantity: { type: number, minimum: 0 }
              unitPriceMinor: { type: integer, minimum: 1, maximum: 9007199254740991 }
              lineAmountMinor: { type: integer, minimum: 1, maximum: 9007199254740991 }
              invoicedAmountMinor: { type: integer, minimum: 0, maximum: 9007199254740991 }
        version: { type: integer, minimum: 1 }
    SubmissionRequirements:
      type: object
      required: [acceptedMediaTypes, maxDocumentBytes, requireOpenPurchaseOrder, enforceRemainingBalance, uniqueInvoiceNumberRequired]
      properties:
        acceptedMediaTypes:
          type: array
          minItems: 1
          maxItems: 1
          uniqueItems: true
          items: { type: string, const: application/pdf }
        maxDocumentBytes: { type: integer, const: 1048576 }
        requireOpenPurchaseOrder: { type: boolean, const: true }
        enforceRemainingBalance: { type: boolean, const: true }
        uniqueInvoiceNumberRequired: { type: boolean, const: true }
    ValidationResult:
      type: object
      required: [valid, invoiceNumber, purchaseOrder, issues]
      properties:
        valid: { type: boolean }
        invoiceNumber: { $ref: "#/components/schemas/InvoiceNumber" }
        purchaseOrder:
          oneOf:
            - { $ref: "#/components/schemas/PurchaseOrder" }
            - { type: "null" }
        issues:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string }
    SubmissionBatchResult:
      type: object
      required: [batchId, items, submittedAt]
      properties:
        batchId: { type: string, format: uuid }
        submittedAt: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            required: [invoiceNumber, portalReference, portalStatus, purchaseOrderNumber, remainingAmountMinor, currency]
            properties:
              invoiceNumber: { $ref: "#/components/schemas/InvoiceNumber" }
              portalReference: { type: string }
              portalStatus: { type: string, enum: [received] }
              purchaseOrderNumber: { $ref: "#/components/schemas/PurchaseOrderNumber" }
              remainingAmountMinor: { type: integer, minimum: 0, maximum: 9007199254740991 }
              currency: { type: string, pattern: "^[A-Z]{3}$" }
    AuditEvent:
      type: object
      required: [id, action, entityType, entityId, details, createdAt]
      properties:
        id: { type: integer, minimum: 1 }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: string }
        details: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    InvoiceException:
      type: object
      additionalProperties: false
      required: [exceptionCode, category, owner, status, message, resolutionGuidance, allowedActions, requiredDocumentKind, supplierCanResolve, authorityBoundary, createdAt, updatedAt]
      properties:
        exceptionCode: { type: string, pattern: "^[a-z][a-z0-9_]{1,63}$" }
        category: { type: string, enum: [supplier_data, purchase_order, receiving, tax, document, duplicate, payment, other] }
        owner: { type: string, enum: [supplier_ar, buyer_ap, buyer_procurement, buyer_receiving, shared] }
        status: { type: string, enum: [open, responded, resolved, cancelled] }
        message: { type: string }
        resolutionGuidance: { type: string }
        allowedActions: { type: array, uniqueItems: true, items: { type: string } }
        requiredDocumentKind: { type: [string, "null"], enum: [proof_of_delivery, service_acceptance, timesheet, tax_document, contract, other, null] }
        supplierCanResolve: { type: boolean }
        authorityBoundary:
          type: string
          description: Explicit trust statement. Buyer-owned blockers tell the supplier agent that the work is not within its authority and recommend a tracked AP case.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    InvoiceWorkflowItem:
      type: object
      additionalProperties: false
      required: [invoiceNumber, portalReference, amountMinor, currency, invoiceStatus, exception, latestInquiry]
      properties:
        invoiceNumber: { $ref: "#/components/schemas/InvoiceNumber" }
        portalReference: { type: string }
        amountMinor: { type: integer, minimum: 1, maximum: 9007199254740991 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        invoiceStatus: { type: string, enum: [received, under_review, accepted, rejected, disputed, voided, paid] }
        exception: { $ref: "#/components/schemas/InvoiceException" }
        latestInquiry:
          oneOf:
            - type: object
              additionalProperties: false
              required: [caseReference, status, subject, createdAt]
              properties:
                caseReference: { type: string, pattern: "^CASE-[0-9]{8}-[A-F0-9]{8}$" }
                status: { type: string, enum: [open, in_progress, resolved, closed] }
                subject: { type: string }
                createdAt: { type: string, format: date-time }
            - { type: "null" }
    SubmissionReceipt:
      type: object
      required: [invoiceNumber, portalReference, purchaseOrderNumber, amountMinor, currency, status, createdAt, settlementExpectedAt, paidAt, paymentReference]
      properties:
        invoiceNumber: { $ref: "#/components/schemas/InvoiceNumber" }
        portalReference: { type: string }
        purchaseOrderNumber: { $ref: "#/components/schemas/PurchaseOrderNumber" }
        amountMinor: { type: integer, minimum: 1, maximum: 9007199254740991 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        status: { type: string, enum: [received, under_review, accepted, rejected, disputed, voided, paid] }
        createdAt: { type: string, format: date-time }
        settlementExpectedAt:
          type: [string, "null"]
          format: date-time
          description: Synthetic buyer settlement time for each eligible second committed invoice.
        paidAt: { type: [string, "null"], format: date-time }
        paymentReference: { type: [string, "null"], pattern: "^PAY-[0-9]{8}-[A-F0-9]{8}$" }
        revision: { type: integer, minimum: 1 }
        timeline:
          type: array
          items:
            type: object
            required: [status, eventCode, message, actorKind, createdAt]
            properties:
              status: { type: string }
              eventCode: { type: string }
              message: { type: string }
              actorKind: { type: string, enum: [supplier, buyer, system] }
              createdAt: { type: string, format: date-time }
        exceptions: { type: array, items: { $ref: "#/components/schemas/InvoiceException" } }
        inquiries: { type: array, items: { type: object, additionalProperties: true } }
    InvoiceStatusResult:
      type: object
      additionalProperties: false
      required: [found, submission]
      properties:
        found: { type: boolean }
        submission:
          oneOf:
            - { $ref: "#/components/schemas/SubmissionReceipt" }
            - { type: "null" }
    BuyerCase:
