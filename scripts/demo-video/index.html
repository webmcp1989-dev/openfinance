<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenFinance demo renderer</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #07110f; color: #ecfff8; }
      main { width: min(1280px, calc(100vw - 40px)); }
      canvas { width: 100%; aspect-ratio: 16 / 9; border: 1px solid #2d4a42; border-radius: 18px; background: #0b1714; box-shadow: 0 24px 80px #0008; }
      video { width: 100%; margin-top: 24px; border: 1px solid #2d4a42; border-radius: 18px; background: #000; }
      .controls { display: flex; align-items: center; gap: 14px; margin-top: 18px; }
      button { border: 0; border-radius: 999px; padding: 12px 20px; background: #85f2be; color: #082019; font: inherit; font-weight: 750; cursor: pointer; }
      button:disabled { cursor: wait; opacity: .6; }
      output { color: #b9d6cc; }
    </style>
  </head>
  <body>
    <main>
      <canvas width="1600" height="900" aria-label="OpenFinance demo preview"></canvas>
      <div class="controls">
        <button type="button">Render demo</button>
        <output>Ready.</output>
      </div>
      <video controls preload="metadata" src="/assets/openfinance-demo.webm"></video>
      <div class="controls" aria-label="Video verification seeks">
        <button type="button" data-seek="55">Inspect 0:55</button>
        <button type="button" data-seek="105">Inspect 1:45</button>
        <button type="button" data-seek="155">Inspect 2:35</button>
      </div>
    </main>
    <script type="module" src="/renderer.js"></script>
  </body>
</html>
